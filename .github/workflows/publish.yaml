name: Publish

# Every release after the first. 0.1.0 was published by hand: npm's trusted
# publishing can only be configured for a package that already exists. From
# then on this publishes with no stored credential — the trusted publisher
# exchanges GitHub's OIDC token for the right to stage, and a person approves
# the stage with 2FA. The same shape as actualwork's publish-mcp.yml.
on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      # Node 24, not the 22 validate.yaml pins: Node 22 bundles npm 10, and
      # `npm stage` needs npm >= 11.15.0 (Node 24 bundles 11.19.0).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag and manifest must agree
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./packages/jdm-editor-vue/package.json').version")"

      - name: Gates
        run: |
          pnpm format:check
          pnpm build
          pnpm typecheck
          pnpm test

      # The published bundle must LOAD — every other gate passed while the
      # package could not be imported at all.
      - name: Check the built bundle
        run: pnpm --filter @nfk.st/jdm-editor-vue check:dist

      # Packs dist/ exactly as the gates above built it. `--filter … pack`
      # writes the tarball to the repo root, not the package directory
      # (measured with pnpm 10).
      - run: pnpm --filter @nfk.st/jdm-editor-vue pack

      # `npm stage publish`, not `npm publish`: the trusted publisher is
      # stage-only, so the release waits for a 2FA approval. That is a setting
      # on npmjs.com, not in this file — "allow npm publish" there would grant
      # a direct publish and skip the approval.
      - run: npm stage publish "nfk.st-jdm-editor-vue-${GITHUB_REF_NAME#v}.tgz"

      # Staging is this run's last state: approving needs interactive 2FA, so
      # a green run means staged, not live.
      - name: Staged, awaiting approval
        run: |
          echo "::notice::@nfk.st/jdm-editor-vue ${GITHUB_REF_NAME#v} is staged. Approve it with 2FA on npmjs.com (Staged Packages tab) or via \`npm stage approve\` locally."
