name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    # Mirrors upstream's flow: a release commit publishes the package.
    # Restricted to master — upstream's trigger accepts any branch, so a
    # feature-branch commit could publish before review.
    if: "startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Gates
        run: |
          pnpm format:check
          pnpm build
          pnpm typecheck
          pnpm test

      # The published bundle must LOAD — every other gate passed while the
      # package could not be imported at all.
      - name: Check the built bundle
        run: pnpm --filter @nfk.st/jdm-editor-vue check:dist

      # A version that is already on the registry must not be published
      # again — npm answers 403 and the whole run fails.
      - name: Skip a version that is already published
        id: already
        run: |
          VERSION=$(node -p "require('./packages/jdm-editor-vue/package.json').version")
          if npm view "@nfk.st/jdm-editor-vue@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on npm — nothing to publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm publish runs the package's prepublishOnly (vite build), so a
      # stale dist/ can never ship.
      - name: Publish
        if: steps.already.outputs.published == 'false'
        run: npm publish --access public
        working-directory: packages/jdm-editor-vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
