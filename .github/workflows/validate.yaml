name: Validate

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Format check
        run: pnpm format:check

      # Build first: the playground type-checks against the library's emitted
      # declarations, which are not in the repository.
      - name: Build
        run: pnpm build

      # The published bundle must LOAD — every other gate passed while the
      # package could not be imported at all.
      - name: Check the built bundle
        run: pnpm --filter @nfk.st/jdm-editor-vue check:dist

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
